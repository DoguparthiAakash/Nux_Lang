[package]
name = "nux_installer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.29.1"
zip = "8.6.0"
directories = "6.0.0"
log = "0.4.34"
simple_logger = "5.2.0"
rust-embed = "8.4"
egui_extras = { version = "0.29.1", features = ["image", "all_loaders"] }
image = { version = "0.24.9", features = ["png"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winres = "0.1.12"
